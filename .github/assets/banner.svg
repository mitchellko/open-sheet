<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">open-sheet — two cells feeding one, drawn across a spreadsheet grid</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c34"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- the grid, dense enough to read as a spreadsheet at thumbnail size -->
  <g stroke="#1e293b" stroke-width="1.5">
    <path d="M0 96H1280M0 192H1280M0 288H1280M0 384H1280M0 480H1280M0 576H1280"/>
    <path d="M128 0V640M256 0V640M384 0V640M512 0V640M640 0V640M768 0V640M896 0V640M1024 0V640M1152 0V640"/>
  </g>

  <!-- two cells feeding one: the dependency the framework owns -->
  <g>
    <rect x="516" y="132" width="120" height="76" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <rect x="772" y="132" width="120" height="76" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <path d="M576 208V264H704V320M832 208V264H704" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <rect x="644" y="320" width="120" height="76" fill="#2563eb"/>
  </g>

  <!-- wordmark, large enough to survive a 200px-wide card -->
  <rect x="128" y="474" width="52" height="52" rx="6" fill="#2563eb"/>
  <text x="204" y="519" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#f8fafc" letter-spacing="-2">open-sheet</text>
  <text x="204" y="570" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="30" font-weight="400" fill="#94a3b8">The spreadsheet framework built for agents</text>
</svg>
