name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  # The claim this project rests on: the exported .xlsx contains live formulas,
  # and our evaluator agrees with a real spreadsheet engine about what they mean.
  # Runs separately because it needs LibreOffice on the runner.
  recalc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-calc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/core/src/export/recalc.test.tsx

  # The only job that catches faults existing solely in the packaged shape: it
  # packs, installs into a clean directory, and drives a browser. Two blank-screen
  # bugs shipped past status-code checks before this existed.
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:published

  # Discord's /github endpoint renders issues, pull requests and pushes but
  # ignores workflow_run entirely, so a red build would be the one thing the
  # channel never heard about. This says it in the channel's own words.
  notify:
    needs: [check, recalc, published]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Say which job broke
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "no DISCORD_WEBHOOK secret; nothing to notify"
            exit 0
          fi
          jq -n \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --arg who "$GITHUB_ACTOR" \
            '{
              embeds: [{
                title: "CI failed on \($branch)",
                url: $url,
                description: "`\($sha)` pushed by \($who)",
                color: 15548997
              }]
            }' > payload.json
          curl -sS -f -X POST -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
